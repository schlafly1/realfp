# GitHub Actions workflow: build the doc-gen4 API reference and deploy it to
# GitHub Pages at https://schlafly1.github.io/realfp/.
#
# Runs on manual dispatch, and on pushes to main that may change the generated
# docs (Lean sources, Lake/toolchain manifests, the docbuild project, or this
# workflow). Settings -> Pages -> Source must be "GitHub Actions".
#
# The docs job adds swap and caps Lean/Lake parallelism (LEAN_NUM_THREADS)
# because a full Mathlib-inclusive doc-gen4 build can exceed the 16 GB RAM of
# a GitHub-hosted ubuntu-latest runner. Lake 4.36 has no -j flag; build jobs
# are Lean tasks scheduled on the runtime thread pool, which that env var
# limits.

name: Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.lean'
      - 'docbuild/**'
      - '.github/workflows/docs.yml'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'RealFPMathlib/lean-toolchain'
      - 'RealFPMathlib/lakefile.lean'
      - 'RealFPMathlib/lake-manifest.json'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # GitHub-hosted x86 runners may lack AVX-512; same portable backend as ci.yml.
      IV64_BACKEND: rnerr
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h /
          sudo swapoff -a || true
          sudo rm -f /swapfile2
          sudo fallocate -l 12G /swapfile2
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          swapon --show
          free -h

      - name: Cache elan
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'RealFPMathlib/lean-toolchain') }}

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache core Lake build
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-core-rnerr-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-core-rnerr-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-

      - name: Cache RealFPMathlib packages and build
        uses: actions/cache@v4
        with:
          # docbuild/lakefile.toml shares this packagesDir with RealFPMathlib
          path: |
            RealFPMathlib/.lake
            docbuild/.lake
          key: lake-docs-rnerr-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'RealFPMathlib/lean-toolchain', 'RealFPMathlib/lakefile.lean', 'RealFPMathlib/lake-manifest.json', 'docbuild/lakefile.toml', 'docbuild/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-docs-rnerr-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'RealFPMathlib/lean-toolchain', 'RealFPMathlib/lakefile.lean', 'RealFPMathlib/lake-manifest.json', 'docbuild/lakefile.toml', 'docbuild/lake-manifest.json') }}-

      - name: Build core library
        run: lake -R -Kbackend=rnerr build Interval64 Interval128 Interval64Proofs

      - name: Get Mathlib cache
        working-directory: RealFPMathlib
        run: lake -R -Kbackend=rnerr exe cache get

      - name: Build RealFPMathlib
        working-directory: RealFPMathlib
        run: lake -R -Kbackend=rnerr build RealFPMathlib

      - name: Generate API documentation
        working-directory: docbuild
        env:
          # Caps concurrent doc-gen4/Lake jobs. Default is hardware concurrency.
          LEAN_NUM_THREADS: "2"
        run: |
          set +e
          (
            while true; do
              echo "===== $(date -u +%H:%M:%S)Z mem ====="
              free -h
              swapon --show || true
              sleep 30
            done
          ) &
          MEMLOG_PID=$!
          MATHLIB_NO_CACHE_ON_UPDATE=1 lake -R -Kbackend=rnerr update doc-gen4
          status=$?
          if [ "$status" -eq 0 ]; then
            lake -R -Kbackend=rnerr build Interval64:docs Interval128:docs Interval64Proofs:docs RealFPMathlib:docs
            status=$?
          fi
          kill "$MEMLOG_PID" 2>/dev/null || true
          wait "$MEMLOG_PID" 2>/dev/null || true
          echo "===== final mem ====="
          free -h
          du -sh .lake/build/doc || true
          exit "$status"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docbuild/.lake/build/doc

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
